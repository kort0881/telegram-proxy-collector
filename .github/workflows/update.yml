name: Update Verified Proxy Lists

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-proxies
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45        # было 25 — подняли с запасом

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet -r requirements.txt

      - name: Download geoip.dat
        run: |
          mkdir -p data
          wget -q -O data/geoip.dat \
            https://cdn.jsdelivr.net/gh/GrimbirdUsers/ru-routing-dat@main/geoip.dat
          ls -lh data/geoip.dat

      - name: Run Proxy Collector
        timeout-minutes: 35     # лимит самого шага
        run: |
          python main.py \
            --top 100 \
            --timeout 2.0 \
            --workers 200 \
            --max-check 30000 \
            --output-dir verified \
            --geoip data/geoip.dat

      - name: Copy files to root
        run: |
          cp verified/proxy_ru_verified.txt   proxy_ru.txt
          cp verified/proxy_eu_verified.txt   proxy_eu.txt
          cp verified/proxy_us_verified.txt   proxy_us.txt   2>/dev/null || echo "US file not found"
          cp verified/proxy_asia_verified.txt proxy_asia.txt 2>/dev/null || echo "ASIA file not found"
          cp verified/socks5_proxies.txt      socks5.txt

          cat verified/proxy_ru_verified.txt \
              verified/proxy_eu_verified.txt \
              verified/proxy_us_verified.txt \
              verified/proxy_asia_verified.txt \
              2>/dev/null > proxy_all_mtproto.txt || true

          cat verified/proxy_ru_verified.txt \
              verified/proxy_eu_verified.txt \
              2>/dev/null > proxy_all.txt || true

      - name: Statistics & Outputs
        id: stats
        run: |
          RU=$(grep -c '^tg://' proxy_ru.txt 2>/dev/null || echo 0)
          EU=$(grep -c '^tg://' proxy_eu.txt 2>/dev/null || echo 0)
          US=$(grep -c '^tg://' proxy_us.txt 2>/dev/null || echo 0)
          ASIA=$(grep -c '^tg://' proxy_asia.txt 2>/dev/null || echo 0)
          SOCKS=$(grep -c '^tg://' socks5.txt 2>/dev/null || echo 0)
          TOTAL=$((RU+EU+US+ASIA))

          {
            echo "mtproto_count=$TOTAL"
            echo "socks5_count=$SOCKS"
            echo "ru_count=$RU"
            echo "eu_count=$EU"
            echo "us_count=$US"
            echo "asia_count=$ASIA"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## 📊 Итоги обновления"
            echo ""
            echo "| Регион | Кол-во |"
            echo "|---|---|"
            echo "| 🇷🇺 RU | $RU |"
            echo "| 🇪🇺 EU | $EU |"
            echo "| 🇺🇸 US | $US |"
            echo "| 🌏 ASIA | $ASIA |"
            echo "| **Всего MTProto** | **$TOTAL** |"
            echo "| 🔌 SOCKS5 | $SOCKS |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit & Push
        id: commit
        run: |
          git config user.name "Proxy Bot"
          git config user.email "bot@github.com"

          # verified/ в .gitignore → добавляем принудительно ТОЛЬКО её
          git add -f verified/ 2>/dev/null || true

          # корневые файлы — по обычным правилам
          for f in proxy_ru.txt proxy_eu.txt proxy_us.txt proxy_asia.txt \
                   socks5.txt proxy_all.txt proxy_all_mtproto.txt; do
            [ -f "$f" ] && git add "$f" || true
          done

          if git diff --staged --quiet; then
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
            echo "Нет изменений"
            exit 0
          fi

          git commit -m "🔥 Update proxies $(date -u +'%Y-%m-%d %H:%M UTC')"

          # pull --rebase ДО push
          git pull --rebase --autostash origin main || true
          git push origin main

          echo "changes_detected=true" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.commit.outputs.changes_detected == 'true'
        id: tag
        run: |
          TAG="v$(date -u +'%Y.%m.%d-%H%M%S')-${{ github.run_id }}-${{ github.run_attempt }}"
          git tag -a "$TAG" -m "Auto-update proxies $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.commit.outputs.changes_detected == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Proxy Update ${{ steps.tag.outputs.tag }}"
          body: |
            Автоматическое обновление списков прокси.
            - **Дата**: $(date -u +'%Y-%m-%d %H:%M UTC')
            - **MTProto**: ${{ steps.stats.outputs.mtproto_count }}
            - **SOCKS5**: ${{ steps.stats.outputs.socks5_count }}
          files: |
            proxy_all_mtproto.txt
            socks5.txt
            verified/proxy_all_verified.json
            verified/proxy_stats_verified.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
